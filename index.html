<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="有些话，留在这里。">
<title>留在这里</title>
<style>
:root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #eae7e1; background: #13151c; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at 92% 0%, #6a54432e, transparent 58%), radial-gradient(ellipse at 0% 100%, #494e752b, transparent 62%), linear-gradient(135deg, #171a23, #13151c 65%); }
main { width: min(1080px, calc(100% - 96px)); margin: 0 auto; padding: clamp(64px, 10vh, 128px) 0 64px; }
.statement { margin: 0; font-size: clamp(26px, 3.05vw, 42px); font-weight: 450; line-height: 1.85; letter-spacing: .035em; overflow-wrap: anywhere; }
.statement > span { display: block; text-wrap: balance; }
.statement > span + span { margin-top: .6em; }
.opening, .ending { color: #f3dfbd; }
details { max-width: 660px; margin-top: 48px; border-top: 1px solid #ffffff24; }
summary { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; color: #c4c2c0; font-size: 15px; cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: #dbc7a9; font-size: 24px; line-height: 1; font-weight: 300; }
details[open] summary::after { content: "−"; }
summary:hover { color: #fff; }
form { padding: 6px 0 0; }
fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
label { display: block; margin: 22px 0 10px; font-size: 15px; color: #dedbd4; }
label:first-of-type { margin-top: 0; }
input, textarea, button { font: inherit; }
input, textarea { width: 100%; border: 1px solid #ffffff30; border-radius: 7px; padding: 14px 16px; color: #f1eee8; background: #ffffff05; font-size: 16px; line-height: 1.6; }
textarea { min-height: 150px; resize: vertical; }
input::placeholder, textarea::placeholder { color: #93949d; opacity: 1; }
:focus-visible { outline: 2px solid #e4c99f; outline-offset: 5px; }
input:focus, textarea:focus { border-color: #e4c99f; }
.note { margin: 14px 0 20px; font-size: 13px; line-height: 1.8; color: #a9a9b1; }
button { min-height: 48px; padding: 12px 25px; border: 1px solid #e3cfad; border-radius: 7px; background: #e3cfad; color: #26241f; font-size: 15px; font-weight: 600; cursor: pointer; }
button:hover { background: #f2debc; }
button:disabled { opacity: .65; cursor: default; }
.status { min-height: 1.8em; margin: 16px 0 0; font-size: 14px; line-height: 1.8; color: #dfd4be; overflow-wrap: anywhere; }
.status[data-state="error"] { color: #f0b6ad; }
noscript p { color: #dbc7a9; line-height: 1.8; }
::selection { background: #d1b48a; color: #171a23; }
@media (max-width: 600px) {
    main { width: calc(100% - 44px); padding: 48px 0 32px; }
    .statement { font-size: 24px; line-height: 1.9; letter-spacing: .02em; }
    .statement > span + span { margin-top: .8em; }
    details { margin-top: 32px; }
    button { width: 100%; }
}
</style>
</head>
<body>
<main>
    <h1 class="statement" id="statement"><span class="opening">？什么信我还真没收到，我也基本联系方式全拉黑了，你那边应该也全是拉黑的，也没有任何办法联系上。</span><span>总之我想说，看到这个网站通知留言我差点心脏从嘴里蹦出来了，心跳得特别快，很多尘封的事情都开始攻击我。</span><span>如果没有什么一定要跟我说的什么话，就算了。<br><span class="ending">如果有，好歹给我留个联系方式。</span></span></h1>
    <details id="contact-panel">
        <summary>留句话和联系方式</summary>
        <form id="contact-form">
            <fieldset id="contact-fields" disabled>
                <label for="contact">能联系到你的方式（必填）</label>
                <input id="contact" name="contact" type="text" autocomplete="off" maxlength="200" required placeholder="邮箱、微信号，或其他能收到回复的方式" aria-describedby="contact-note">
                <label for="message">想说的话（必填）</label>
                <textarea id="message" name="message" maxlength="5000" required placeholder="把想说的话写在这里。"></textarea>
                <p class="note" id="contact-note">留言和联系方式会发到我的邮箱，不会公开显示。请确认你留下的方式能收到回复。</p>
                <button id="send-button" type="submit">发送留言</button>
            </fieldset>
            <p class="status" id="send-status" role="status" aria-live="polite" aria-atomic="true"></p>
        </form>
        <noscript><p>发送留言需要启用浏览器的 JavaScript。启用后刷新即可，无需密码。</p></noscript>
    </details>
</main>
<script>
'use strict';
const form = document.getElementById('contact-form');
const fields = document.getElementById('contact-fields');
const contact = document.getElementById('contact');
const message = document.getElementById('message');
const button = document.getElementById('send-button');
const status = document.getElementById('send-status');
fields.disabled = false;
let sending = false;
let submitted = false;

for (const input of [contact, message]) {
    input.addEventListener('input', () => input.setCustomValidity(''));
}

form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (sending || submitted) return;
    contact.setCustomValidity(contact.value.trim() ? '' : '请留下能联系到你的方式。');
    message.setCustomValidity(message.value.trim() ? '' : '请写下想说的话。');
    if (!form.reportValidity()) return;

    sending = true;
    button.disabled = true;
    contact.readOnly = true;
    message.readOnly = true;
    button.textContent = '正在发送…';
    status.dataset.state = 'pending';
    status.textContent = '正在提交，请稍等。';
    form.setAttribute('aria-busy', 'true');
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000);

    try {
        // 沿用原邮件模板，把联系方式写入正文，确保旧模板也能显示。
        // 只在主动提交时发送填写内容，不附带设备或定位信息。
        const response = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'omit',
            signal: controller.signal,
            body: JSON.stringify({
                service_id: 'service_y06z3l6',
                template_id: 'template_evme7o9',
                user_id: '8FpKE1LjIxhbjC_5O',
                template_params: {
                    title: '收到了一段留言和联系方式',
                    name: '网站留言',
                    message: `联系方式：${contact.value.trim()}\n\n想说的话：\n${message.value.trim()}`,
                    time: new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false })
                }
            })
        });
        if (!response.ok) throw new Error(`EmailJS HTTP ${response.status}`);
        submitted = true;
        button.textContent = '已提交';
        status.dataset.state = 'success';
        status.textContent = '留言已提交给邮件服务，送达可能需要一点时间。你留下的联系方式会一并发给我。';
    } catch (error) {
        // 网络中断不能证明邮件未发出；保留原文并提示重复发送的可能。
        status.dataset.state = 'error';
        status.textContent = '暂时无法确认是否送达。内容已保留在当前页面，请先复制保存，稍后再试；重试可能重复发送。';
        button.textContent = '重试发送';
    } finally {
        clearTimeout(timer);
        sending = false;
        button.disabled = submitted;
        contact.readOnly = submitted;
        message.readOnly = submitted;
        form.setAttribute('aria-busy', 'false');
    }
});
</script>
</body>
</html>
