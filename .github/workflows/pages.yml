name: Publish page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare only the current page
        shell: bash
        run: |
          # 只发布新首页，旧照片、脚本和回忆文档不进入站点产物。
          publish_dir="$RUNNER_TEMP/current-page"
          mkdir "$publish_dir"
          cp index.html "$publish_dir/index.html"
          test "$(find "$publish_dir" -mindepth 1 | wc -l)" -eq 1
          test -f "$publish_dir/index.html"
          test ! -L "$publish_dir/index.html"
      - name: Upload current page
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/current-page
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
